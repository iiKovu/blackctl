monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1532"
        device.product.id = "0x0a55"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "usb-gaming-headset.conf"
        device.profile = "output:stereo-game+input:mono-chat"
        api.alsa.soft-mixer = true
      }
    }
  }
]
